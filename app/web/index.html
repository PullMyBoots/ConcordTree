<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Infer gene trees and species trees from sequence alignments.">
  <title>ConcordTree</title>
  <link rel="icon" type="image/svg+xml" href="/mark.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/settings.css">
  <link rel="stylesheet" href="/seasons.css">
  <script src="/settings.js" defer></script>
  <script src="/geometry.js" defer></script>
  <script src="/seasons.js" defer></script>
  <script src="/dashboard.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body data-theme="geometry">
  <div class="cinema" aria-hidden="true">
    <canvas id="evolutionCanvas"></canvas>
    <picture class="scene"><source media="(max-width: 600px)"><img alt="" decoding="async"></picture>
    <picture class="scene"><source media="(max-width: 600px)"><img alt="" decoding="async"></picture>
    <div class="cinema-shade"></div>
    <div class="light-rays"></div>
    <div class="motes"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="cinema-grain"></div>
  </div>
  <main>
    <section id="submitPage" class="submit-page" aria-label="Submit alignment">
      <form id="taskForm">
        <div class="task-tabs" role="group" aria-label="Tree type">
          <button type="button" data-task="gene" class="active" aria-pressed="true">Gene Tree</button>
          <button type="button" data-task="species" aria-pressed="false">Species Tree</button>
        </div>
        <div class="inference-options" aria-label="Inference options">
          <label class="support-option"><input id="showSupport" type="checkbox" checked><span>Branch support</span></label>
        </div>
        <input type="file" id="alignmentFile" accept=".phy,.phylip,.txt" hidden>
        <button class="dropzone" id="uploadTrigger" type="button" aria-label="Upload alignment and start inference">
          <span class="upload-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 27V10m-6 6 6-6 6 6M10 25v5a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-5"/></svg></span>
        </button>
        <button id="exampleButton" class="text-button example-button" type="button">Try example</button>
        <div class="file-card" id="fileCard" hidden>
          <div><strong id="fileName"></strong><span id="fileMeta"></span></div>
          <button id="removeFile" class="text-button" type="button" aria-label="Choose another file">Change</button>
        </div>
        <p class="error" id="formError" role="alert" hidden></p>
        <details id="hostLoad" class="host-load" data-status="loading" aria-label="Current host load">
          <summary class="host-header"><span class="host-title"><i class="host-dot" aria-hidden="true"></i>Host load</span><span id="hostSummary">Connecting…</span><span class="host-chevron" aria-hidden="true"></span></summary>
          <div class="host-content">
          <div class="host-overview">
            <div class="host-metric"><div><span>CPU</span><strong id="cpuUsage">—</strong></div><meter id="cpuMeter" min="0" max="100" value="0" aria-label="CPU utilization"></meter><small id="cpuDetail">Sampling…</small></div>
            <div class="host-metric"><div><span>Memory</span><strong id="memoryUsage">—</strong></div><meter id="memoryMeter" min="0" max="100" value="0" aria-label="Memory utilization"></meter><small id="memoryDetail">Sampling…</small></div>
          </div>
          <div id="gpuMetrics" class="gpu-metrics"><p class="host-unavailable">Checking NVIDIA GPUs…</p></div>
          <p id="hostStatus">Connecting…</p></div>
        </details>
      </form>
    </section>

    <section id="resultPage" class="result-page" aria-labelledby="resultTitle" hidden>
      <header class="result-header">
        <div><h1 id="resultTitle" tabindex="-1">Inferring</h1><p id="resultDetail"></p><p id="resultTiming" class="result-timing" hidden></p></div>
        <button id="backButton" class="text-button" type="button">Back</button>
      </header>
      <p id="jobStatus" role="status" aria-live="polite"></p>
      <div id="inferenceProgress" class="inference-progress" hidden>
        <div id="progressBar" class="growth-panel" role="progressbar" aria-label="Inference stage progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <svg id="growthTree" class="growth-tree" viewBox="0 0 400 310" aria-hidden="true">
            <defs><linearGradient id="branchGradient" gradientUnits="userSpaceOnUse" x1="200" y1="277" x2="200" y2="50"><stop stop-color="#8caa77"/><stop offset="1" stop-color="#dcebb0"/></linearGradient><radialGradient id="seedGlow"><stop stop-color="#c5dfa1" stop-opacity=".2"/><stop offset="1" stop-color="#c5dfa1" stop-opacity="0"/></radialGradient></defs>
            <ellipse class="growth-halo" cx="200" cy="279" rx="90" ry="23" fill="url(#seedGlow)"/>
            <ellipse class="growth-ripple" cx="200" cy="279" rx="24" ry="6"/>
            <path d="M116 279 Q200 276 284 279" class="growth-ground"/>
            <g id="growthRoots"></g><g id="growthCrown"><g id="growthBranches"></g><g id="growthLeaves"></g><g id="growthSap"></g></g><g id="growthMotes"></g>
            <ellipse id="growthSeed" cx="200" cy="277" rx="5" ry="8" transform="rotate(28 200 277)"/>
          </svg>
        </div>
        <section class="run-log" aria-label="Inference stages">
          <ol id="pipelineProgress" class="pipeline-progress" aria-label="Algorithm stages"></ol>
          <div id="logTail" tabindex="0" aria-label="Run history">
            <table class="run-table"><colgroup id="logColumns"></colgroup><thead id="logHead"></thead><tbody id="logRows"></tbody></table>
            <p id="logEmpty" class="log-empty">Waiting to start</p>
          </div>
        </section>
      </div>
      <div id="resultActions" class="result-actions" hidden>
        <button id="previewButton" class="text-button" type="button" aria-expanded="false" aria-controls="treeCanvas" hidden>Preview</button>
        <a id="downloadTree" class="primary-button" download="tree.nwk">Download</a>
      </div>
      <div id="treeCanvas" class="tree-canvas" hidden>
        <div id="treeScroll" class="tree-scroll" tabindex="0" aria-label="Tree preview. Scroll to explore; Ctrl-scroll to zoom.">
          <svg id="treeSvg" viewBox="0 0 760 500" role="img" aria-label="Tree preview"></svg>
        </div>
        <p id="canvasEmpty" class="canvas-empty" hidden></p>
        <span class="tree-scroll-hint">Scroll to explore</span>
        <button id="resetView" class="text-button reset-view" type="button">Reset View</button>
      </div>
      <p id="supportLegend" class="support-legend" hidden></p>
      <div class="intermediate-actions"><button id="pauseButton" class="text-button" type="button" hidden>Pause</button><a id="checkpointDownload" class="text-button" download="intermediate-tree.nwk" hidden>Download current tree</a></div>
      <button id="cancelButton" class="text-button" type="button" hidden>Cancel</button>
    </section>
  </main>

  <button id="settingsButton" class="settings-button" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-controls="settingsDialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.4 3-.5 2.1-1.6.9-2.1-.6-2.6 4.4 1.6 1.5v1.8l-1.6 1.5 2.6 4.4 2.1-.6 1.6.9.5 2.1h5.2l.5-2.1 1.6-.9 2.1.6 2.6-4.4-1.6-1.5v-1.8l1.6-1.5-2.6-4.4-2.1.6-1.6-.9-.5-2.1Z"/><circle cx="12" cy="12.2" r="3.1"/></svg></button>
  <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
    <header><h2 id="settingsTitle">Settings</h2><button id="closeSettings" class="settings-close" type="button" aria-label="Close settings">×</button></header>
    <section id="runtimeSettings" aria-label="Run settings"><div id="runtimeSettingsFields" class="settings-fields">
      <div class="compute-settings" aria-label="Compute resources">
        <label class="parameter-field"><span>CPU threads</span><input id="computeThreads" type="number" min="1" max="64" step="1" required></label>
        <label class="parameter-field"><span>GPU</span><input id="computeGpu" type="number" min="0" max="65535" step="1" list="gpuChoices" required><datalist id="gpuChoices"></datalist></label>
        <small id="computeHint"></small><small id="gpuChoiceName"></small>
      </div>
      <div class="pipeline-toolbar"><div class="pipeline-tasks" role="group" aria-label="Pipeline task"><button type="button" data-pipeline-task="gene">Gene Tree</button><button type="button" data-pipeline-task="species">Species Tree</button></div><button type="button" id="resetWorkflow" class="settings-link">Reset workflow</button></div>
      <div id="pipelinePreview" class="pipeline-preview" aria-label="Enabled workflow"></div>
      <div id="pipelineBlocks" class="pipeline-blocks" aria-label="Algorithm modules"></div>
      <p id="settingsError" class="error" role="alert" hidden></p>
      <p id="settingsMessage" class="settings-message" role="status"></p>
      <div class="settings-actions"><button type="button" id="resetAllSettings" class="settings-link">Reset all</button><div><button type="button" id="discardSettings" class="settings-link">Cancel</button><button type="button" id="saveSettings" class="settings-save">Save</button></div></div>
      </div></section>
  </dialog>

  <div class="background-controls">
    <div id="themeMenu" class="theme-menu" role="group" aria-label="Background themes" hidden>
      <button type="button" data-theme="geometry" aria-pressed="true"><span aria-hidden="true" class="theme-dot geometry-dot"></span>Geometry</button>
      <button type="button" data-theme="seasons" aria-pressed="false"><span aria-hidden="true" class="theme-dot seasons-dot"></span>Seasons</button>
      <button type="button" data-theme="nature" aria-pressed="false"><span aria-hidden="true" class="theme-dot forest-dot"></span>Nature</button>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Choose background theme" aria-expanded="false" aria-controls="themeMenu"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="3"/><circle cx="7" cy="8" r="1.5"/><path d="m3 15 4-4 3 3 3-5 4 6"/></svg><span id="themeName">Geometry</span><span class="theme-chevron" aria-hidden="true">⌃</span></button>
    <button id="nextBackground" class="background-toggle" type="button" aria-label="Next image" title="Next image" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h2c4 0 6 10 10 10h2m-3-3 3 3-3 3M3 15h2c1.5 0 2.7-1.3 3.7-3M11.3 8c1-1.7 2.2-3 3.7-3h2m-3-3 3 3-3 3"/></svg></button>
    <div id="seasonControls" class="season-controls" role="group" aria-label="Season progress" hidden>
      <input id="seasonProgress" type="range" min="0" max="1000" step="1" value="0" aria-label="Season progress" aria-valuetext="Spring">
      <output id="seasonLabel" for="seasonProgress">Spring</output>
    </div>
  <button id="backgroundToggle" class="background-toggle" type="button" aria-label="Pause background" title="Pause background" aria-pressed="false">
    <svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg>
    <svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 5 8 5-8 5Z"/></svg>
  </button>
  </div>
  <div id="photoCredit" class="photo-credit" hidden><a id="photoInfo" href="/credits.html" target="_blank" rel="noopener noreferrer" aria-label="Image details and credits">Image</a><span aria-hidden="true"> · </span><a id="photoLicense" target="_blank" rel="noopener noreferrer"></a></div>
  <span id="themeStatus" class="sr-only" role="status"></span>
  <footer class="site-footer">
    <nav aria-label="Resources">
      <a href="https://yinpingping111.github.io/XiyunJiao/" target="_blank" rel="noopener noreferrer">About Us</a>
      <a href="/report/" target="_blank" rel="noopener noreferrer">Technical Report</a>
      <a href="https://github.com/PullMyBoots/ConcordTree" target="_blank" rel="noopener noreferrer">Code</a>
    </nav>
  </footer>
</body>
</html>
